<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/phenooa/assets/refs/heads/main/assets_web/logo/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHENO-OA</title>
    <script>
      // Theme before first paint, so the splash and page start in the right colours (the app keeps it in sync).
      try { document.documentElement.dataset.theme = localStorage.getItem("phenooa-v2-theme") === "dark-teal" ? "dark-teal" : "light-teal"; } catch (e) {}
    </script>
    <style>
      /* First-visit splash: shown until the page in view is ready (src/lib/preload.ts removes it). */
      #boot { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #F3FAF8; transition: opacity 0.45s ease, visibility 0.45s; font-family: "Pheno Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .mark { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      #boot .name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #0B1F1D; }
      #boot .name span { color: #0F766E; }
      #boot .bar { width: 120px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(15, 118, 110, 0.15); }
      #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #0F766E; animation: boot-bar 1.1s ease-in-out infinite; }
      html[data-theme="dark-teal"] #boot { background: #031716; }
      html[data-theme="dark-teal"] #boot .name { color: #F8FAFC; }
      html[data-theme="dark-teal"] #boot .name span { color: #2DD4BF; }
      html[data-theme="dark-teal"] #boot .bar i { background: #2DD4BF; }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { width: 100%; animation: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-DpIHTCVO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CzPVOWlx.css">
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="mark">
        <img src="https://raw.githubusercontent.com/phenooa/assets/refs/heads/main/assets_web/logo/logo.png" alt="" width="44" height="44" />
        <div class="name">PHENO-<span>OA</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
